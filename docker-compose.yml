services:
  app:
    build: .
    image: albums-app:local
    container_name: albums-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DATABASE_PATH: /data/albums.sqlite
      # NODE_ENV, APP_ORIGIN, COOKIE_SECURE, TRUST_PROXY, SESSION_DAYS come from .env
    env_file:
      - path: .env
        required: false
    volumes:
      - ./data:/data

  admin:
    build: .
    image: albums-app:local
    container_name: albums-admin
    restart: unless-stopped
    command: ["node", "admin/src/server.js"]
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      PORT: 3001
      ADMIN_HOST: 0.0.0.0
      DATABASE_PATH: /data/albums.sqlite
      # ADMIN_TOKEN or ADMIN_PASSWORD_HASH should come from .env.admin
    env_file:
      - path: .env
        required: false
      - path: .env.admin
        required: false
    volumes:
      - ./data:/data

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    network_mode: host
    command: tunnel --no-autoupdate run
    env_file:
      - path: .env.cloudflare
        required: true

  cloudflared-admin:
    profiles:
      - admin-cloudflare
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-admin
    restart: unless-stopped
    network_mode: host
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./.cloudflared-admin:/etc/cloudflared:ro
